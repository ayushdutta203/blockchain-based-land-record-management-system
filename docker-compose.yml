services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: land_records
      POSTGRES_USER: land_user
      POSTGRES_PASSWORD: land_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U land_user -d land_records"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      PORT: 5000
      DATABASE_MODE: postgres
      POSTGRES_URL: postgresql://land_user:land_password@postgres:5432/land_records
      JWT_SECRET: development-secret-change-before-deployment
      UPLOAD_DIR: uploads
      FABRIC_MODE: mock
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
